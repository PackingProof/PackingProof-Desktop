name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 构建与单元测试（Debug）
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: 安装 .NET SDK（10.0，与本机发布工具链一致）
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400

      - name: 选择大空间临时目录
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tempRoot = $null
          foreach ($drive in @(Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -gt 32GB } | Sort-Object Free -Descending)) {
            $candidate = Join-Path $drive.Root "_epm_ci_tmp"
            try {
              New-Item -ItemType Directory -Force -Path $candidate | Out-Null
              $tempRoot = $candidate
              break
            } catch { }
          }
          if (-not $tempRoot) {
            $tempRoot = Join-Path $env:RUNNER_TEMP "epm_ci_tmp"
            New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          }
          "TMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CI temp root: $tempRoot"

      - name: 缓存钉死的 FFmpeg 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: package/dependency-cache/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/ffmpeg-baseline.json') }}

      - name: 缓存 NuGet 包
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 准备钉死的 FFmpeg 依赖
        shell: pwsh
        run: pwsh -NoProfile -File tools\Prepare-PinnedFFmpeg.ps1

      - name: 还原依赖
        run: dotnet restore ExpressPackingMonitoring.sln --nologo

      - name: 构建解决方案
        run: dotnet build ExpressPackingMonitoring.sln -c Debug --no-restore --nologo

      - name: 运行单元测试
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @(
            "test",
            "tests\ExpressPackingMonitoring.Tests\ExpressPackingMonitoring.Tests.csproj",
            "-c", "Debug",
            "--no-build",
            "--no-restore",
            "--nologo"
          )
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            & dotnet @arguments
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 2) {
              throw "单元测试连续两次失败，最后退出码：$LASTEXITCODE"
            }
            Write-Warning "单元测试首次失败，5 秒后完整重跑一次"
            Start-Sleep -Seconds 5
          }

      # 网页是唯一"改一行 JS 就可能整页不工作"的地方，静态断言和语法检查都拦不住：
      # 这里用真实 WebServer + 临时数据库 + 无头 Chrome/Edge 跑完全部 UI 用例。
      - name: 网页 UI 自动化测试（真实浏览器）
        shell: pwsh
        run: pwsh -NoProfile -File tools\Test-WebUi.ps1 -Configuration Debug -SkipBuild

      - name: 检查扩展 API 示例语法
        shell: pwsh
        run: |
          node --check "docs\examples\extension-v1-minimal.js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check "docs\examples\extension-v1-serial-scale.js"

  build-test-vision:
    name: 构建与单元测试（显式包含视觉功能包）
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: 安装 .NET SDK（10.0）
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400

      - name: 缓存锁定的视觉模型
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: package/dependency-cache/vision-models
          key: vision-model-${{ hashFiles('tools/vision-model-baseline.json') }}

      - name: 缓存 NuGet 包
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-vision-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-vision-${{ runner.os }}-

      - name: 准备并校验锁定的视觉模型
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools\Prepare-PinnedVisionModel.ps1
          $modelPath = Join-Path $PWD "package\dependency-cache\vision-models\vision-obb.onnx"
          "PACKINGPROOF_WAYBILL_OBB_MODEL=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKINGPROOF_BENCHMARK_OBB=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKINGPROOF_BENCHMARK_OBB_WIDTH=1280" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKINGPROOF_BENCHMARK_OBB_HEIGHT=720" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 还原、构建并测试显式视觉功能包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore "tests\ExpressPackingMonitoring.Tests\ExpressPackingMonitoring.Tests.csproj" `
            -p:IncludeVisionObb=true --nologo
          if ($LASTEXITCODE -ne 0) { throw "restore failed: $LASTEXITCODE" }
          dotnet build "tests\ExpressPackingMonitoring.Tests\ExpressPackingMonitoring.Tests.csproj" `
            -c Debug -p:IncludeVisionObb=true --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw "build failed: $LASTEXITCODE" }
          dotnet test "tests\ExpressPackingMonitoring.Tests\ExpressPackingMonitoring.Tests.csproj" `
            -c Debug -p:IncludeVisionObb=true --no-build --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw "test failed: $LASTEXITCODE" }
