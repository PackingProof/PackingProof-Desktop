name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 构建与单元测试（Debug）
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: 安装 .NET SDK（9.0，与本机发布工具链一致）
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x

      - name: 还原依赖
        run: dotnet restore ExpressPackingMonitoring.sln --nologo

      - name: 构建解决方案
        run: dotnet build ExpressPackingMonitoring.sln -c Debug --no-restore --nologo

      - name: 运行单元测试
        run: dotnet test ExpressPackingMonitoring.Tests\ExpressPackingMonitoring.Tests.csproj -c Debug --no-build --no-restore --nologo

      - name: 检查用户脚本语法
        run: node --check "Scripts\快递助手订单推送.user.js"
