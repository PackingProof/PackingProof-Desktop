name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 构建与单元测试（Debug）
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: 安装 .NET SDK（9.0，与本机发布工具链一致）
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x

      - name: 选择大空间临时目录
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tempRoot = $null
          foreach ($drive in @(Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -gt 32GB } | Sort-Object Free -Descending)) {
            $candidate = Join-Path $drive.Root "_epm_ci_tmp"
            try {
              New-Item -ItemType Directory -Force -Path $candidate | Out-Null
              $tempRoot = $candidate
              break
            } catch { }
          }
          if (-not $tempRoot) {
            $tempRoot = Join-Path $env:RUNNER_TEMP "epm_ci_tmp"
            New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          }
          "TMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CI temp root: $tempRoot"

      - name: 缓存钉死的 FFmpeg 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: package/dependency-cache/ffmpeg
          key: ffmpeg-${{ hashFiles('Tools/ffmpeg-baseline.json') }}

      - name: 缓存 NuGet 包
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 准备钉死的 FFmpeg 依赖
        shell: pwsh
        run: pwsh -NoProfile -File Tools\Prepare-PinnedFFmpeg.ps1

      - name: 还原依赖
        run: dotnet restore ExpressPackingMonitoring.sln --nologo

      - name: 构建解决方案
        run: dotnet build ExpressPackingMonitoring.sln -c Debug --no-restore --nologo

      - name: 运行单元测试
        run: dotnet test ExpressPackingMonitoring.Tests\ExpressPackingMonitoring.Tests.csproj -c Debug --no-build --no-restore --nologo

      - name: 检查用户脚本语法
        run: node --check "Scripts\PackingProof-Order-Integration-KDZS.user.js"
